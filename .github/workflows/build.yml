name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q EinkReader.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6
      - run: gradle -p proj assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx2g
      - uses: actions/upload-artifact@v4
        with:
          name: EinkReader-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
